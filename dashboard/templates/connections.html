<!DOCTYPE html>
{% extends 'layout.html' %}

{% block content %}

<section id="sideMenu">
    <section id="logo">
        <img src="{{ url_for('static', filename='logo-piccolo.png') }}">
    </section>
    <nav>
        <a href="http://127.0.0.1:5000/"> <i class="fas fa-home"> </i> Home</a>
        <a href="http://127.0.0.1:5000/plants"> <i class="fas fa-seedling"></i> Lista Piante</a>
        <a href="http://127.0.0.1:5000/connections" class="active"> <i class="fas fa-exclamation"></i>Nuove Piante </a>
    </nav>
</section>

<h2> Richieste di connessione: </h2>

<table align="center">
    <thead>
    <tr>
        <th> Serial number</th>
        <th> Ping </th>
        <th> Actions </th>
    </tr>
    </thead>
    <tbody>
    {% for conn in connections: %}
    <tr>
        <td> {{ conn.id }} </td>
        <td> {{ conn.ping }} </td>
        <td> <button> <i class="fas fa-plus"></i> </button>
            <button> <i class="fas fa-minus"></i></button>
        </td>
    </tr>
    {% endfor %}
    {% endblock %}
