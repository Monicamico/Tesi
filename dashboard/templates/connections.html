<!DOCTYPE html>
{% extends 'layout.html' %}

{% block content %}

<section id="sideMenu">
    <section id="logo">
        <img src="{{ url_for('static', filename='logo-piccolo.png') }}">
    </section>
    <nav>
        <a href="http://127.0.0.1:5000/"> <i class="fas fa-home"> </i>Home</a>
        <a href="http://127.0.0.1:5000/plants"> <i class="fas fa-seedling"></i>Plants </a>
        <a href="http://127.0.0.1:5000/connections" class="active"> <i class="fas fa-exclamation"></i>New Plants</a>
    </nav>
</section>

<h2> Richieste di connessione </h2>

<table align="center">
    <thead>
    <tr>
        <th> Serial number</th>
        <th> Ping </th>
        <th> Actions </th>
    </tr>
    </thead>
    <tbody>
    {% for conn in connections: %}
        <tr>
            <td> {{ conn.id }} </td>
            <td> {{ conn.ping }} </td>
            <td>
                <a class="myButton" href="http://127.0.0.1:5000/add_plant_from_conn/{{ conn.id }}">
                    <i class="fas fa-check"></i>
                </a>
                <a class="myButton" href="http://127.0.0.1:5000/refuse_plant_from_conn/{{ conn.id }}">
                    <i class="fas fa-times"></i>
                </a>
            </td>
        </tr>
    {% endfor %}

    {% endblock %}
