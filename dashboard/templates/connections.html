<!DOCTYPE html>
{% extends 'layout.html' %}

{% block content %}
<h2 class="mt-3"> Richieste di connessione </h2>

<table class="MyTable" align="center">
    <thead>
    <tr>
        <th> Numero Seriale </th>
        <th> Numero pairing </th>
        <th> Azioni </th>
    </tr>
    </thead>
    <tbody>

    {% for conn in connections: %}
        <tr>
            <td> {{ conn.id }} </td>
            <td> {{ conn.pairing }} </td>
            <td>
                <a class="myButton" href="http://127.0.0.1:5000/add_plant_from_conn/{{ conn.id }}">
                    <i class="fas fa-check"></i>
                </a>
                <a class="myButton" href="http://127.0.0.1:5000/refuse_plant_from_conn/{{ conn.id }}">
                    <i class="fas fa-times"></i>
                </a>
            </td>
        </tr>
    {% endfor %}

    {% endblock %}
