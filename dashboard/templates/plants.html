<!DOCTYPE html>
<html>

{% extends 'layout.html' %}

 {% block content %}

    <section id="sideMenu">
        <section id="logo">
          <img src="{{ url_for('static', filename='logo-piccolo.png') }}">
      </section>
      <nav>
          <a href="http://127.0.0.1:5000/"><i class="fas fa-home"></i>Home</a>
          <a href="http://127.0.0.1:5000/plants"  class="active"> <i class="fas fa-seedling"></i> Plants </a>
          <a href="http://127.0.0.1:5000/connections"><i class="fas fa-exclamation"></i> New plants </a>
      </nav>
  </section>

    <h2> Lista delle piante registrate </h2>
    <table align="center">
    <thead>
    <tr>
        <th> Serial number</th>
        <th> Ping </th>
        <th> Actions </th>
    </tr>
    </thead>
     <tbody>
     {% for plant in plants: %}
       <tr>
           <td> {{ plant.id }} </td>
           <td> {{ plant.ping }}</td>
           <td>
                <a class="myButton" href="http://127.0.0.1:5000/plant/{{ plant.id }}"> <i class="fas fa-info"></i> </a>
           </td>

       </tr>
    {% endfor %}
     </tbody>
    </table>

{% endblock %}

</html>
