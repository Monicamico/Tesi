<!DOCTYPE html>
<html>

{% extends 'layout.html' %}


 {% block content %}

    <h2 class="mt-3"> Lista delle piante registrate </h2>

    <table width="500px" class="MyTable" align="center">

        <thead>
        <tr>
            <th> Nome del vaso </th>
            <th> ID Radio</th>
            <th> Azioni </th>
        </tr>
        </thead>

        <tbody>
         {% for plant in plants: %}
           <tr>
               <td> {{ plant.name }} </td>
               <td> {{ plant.radio_id }} </td>
               <td>
                    <a class="myButton" title="Modifica" href="http://127.0.0.1:5000/settings/{{ plant.id }}"> <i class="fas fa-cog"></i> </a>
                    <a class="myButton" title="Info" href="http://127.0.0.1:5000/plant/{{ plant.id }}"><i class="fab fa-sistrix"></i></a>
               </td>
           </tr>
        {% endfor %}
        </tbody>

    </table>

    {% endblock %}

</html>
