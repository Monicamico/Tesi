<!DOCTYPE html>
{% extends 'layout.html' %}

{% block content %}
<h2 class="mt-3"> Lista delle radio </h2>

<table width="500px" class="MyTable" align="center">
    <thead>
    <tr>
        <th> ID Radio </th>
        <th> Nome </th>
        <th> Azioni </th>
    </tr>
    </thead>
    <tbody>

    {% for radio in radio_list: %}
        <tr>
            <td> {{ radio.id }} </td>
            <td> {{ radio.name }} </td>
            <td>
              <a class="myButton" title="Modifica" href="http://127.0.0.1:5000/radio/{{ radio.id }}"> <i class="fas fa-cog"></i> </a>
            </td>
        </tr>
    {% endfor %}

    {% endblock %}
