<!DOCTYPE html>
<html lang="en">
{% extends 'layout.html' %}

    {% block content %}

     <h2 class="mt-3"> Impostazioni della radio '{{ radio.name }}'</h2>

     <form action="" method="post" novalidate>
        {{ form.hidden_tag() }}

          <table class="MyTable" align="center">
              <tr>
                 <td> <label> {{ form.radio_name.label }} </label> </td>
                 <td>{{ form.radio_name(size=24, value = radio.name)}} </td>
               </tr>
          </table>

         <p> {{ form.submit()}} </p>

    </form>

    <br>
    <br>
    <a class="myButton" href="http://127.0.0.1:5000/radios"> <i class="fas fa-arrow-circle-left"></i> Indietro </a>

    {% endblock %}
