<!DOCTYPE html>
<html>
{% extends 'layout.html' %}
{% block content %}

    {% if current_user.is_authenticated %}
        <h2 class="mt-3">Registra un nuovo utente </h2>
        <form action="" method="post" novalidate>
        {{ form.hidden_tag() }}

          <table  style="text-align: center; margin-bottom: 0px" width="350px" class="MyTable" align="center">
              <tr><td>
                  <div style="text-align: center; width: 300px" class="input-group m-3">
                    <div class="input-group-prepend">
                        <span style="color: grey" class="input-group-text" id="basic-addon1"> <i class="fas fa-user"></i>
                        </span>
                     </div>
                    <input id="username" aria-describedby="basic-addon1" type="text" class="form-control" name="username" placeholder="Username">
                </div>
              </td></tr>
              <tr><td>
                <div style="text-align: center; width: 300px" class="input-group m-3">
                    <div class="input-group-prepend">
                        <span style="color: grey" class="input-group-text" id="basic-addon2"> <i class="fas fa-lock"></i>
                        </span>
                     </div>
                    <input id="password" aria-labelledby="basic-addon2" type="password" class="form-control" name="password" placeholder="Password">
                </div>
              </td></tr>

              <tr><td>
                <div style="text-align: center; width: 300px" class="input-group m-3">
                    <div class="input-group-prepend">
                        <span style="color: grey"  class="input-group-text" id="basic-addon3"> <i class="fas fa-lock"></i>
                        </span>
                     </div>
                    <input id="password_repeat" aria-labelledby="basic-addon3" type="password" class="form-control" name="password_repeat" placeholder="Ripeti password">
                </div>
              </td></tr>
              <tr><td>
                  <div style="text-align: center; width: 300px" class="input-group m-3">
                        <select name="ruolo_utente" class="form-control">
                         <option style="color: #454545" disabled selected> -- Ruolo -- </option>
                         <option value="0"> Admin </option>
                         <option value="1"> Utente </option>
                         </select>
                    </div>
              </td></tr>
          </table>
          <table  style="text-align: center; margin-top: 0px" width="350px" class="MyTable" align="center">
              <tr> <td>
                  <button class="myButton" id="submit" name="submit" type="submit"> Registra </button>
              </td></tr>
          </table>
        </form>
    {% endif %}

{% endblock %}

</html>
